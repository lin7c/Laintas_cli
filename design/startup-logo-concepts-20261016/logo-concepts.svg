<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1110" viewBox="0 0 1480 1110">
<rect width="1480" height="1110" fill="#101210"/>
<style>text{font-family:"WenQuanYi Zen Hei",sans-serif}.mono{font-family:"DejaVu Sans Mono",monospace;white-space:pre}</style>
<text x="64" y="60" font-size="14" letter-spacing="3" fill="#a7b49b">LAINTAS / STARTUP IDENTITY / 2026</text>
<text x="60" y="124" font-size="43" fill="#f0f0e8">让终端一打开，就认出 laintas。</text>
<text x="64" y="166" font-size="18" fill="#9ca396">四个可用字符实现的方向 · 以下为设计预览，尚未替换现有开屏</text>
<rect x="60" y="212" width="660" height="351" rx="8" fill="#171b17" stroke="#30372c"/>
<text x="86" y="252" font-size="15" fill="#b8ec87" class="mono">01</text>
<text x="125" y="253" font-size="24" fill="#eaece5">终端签名</text>
<text x="86" y="285" font-size="15" fill="#a2aa9b">推荐 · 品牌辨识与日常使用兼顾</text>
<path d="M86 306H694" stroke="#30372c"/>
<text xml:space="preserve" x="88" y="355" class="mono" font-size="24" fill="#b8ec87"> ╷       ╲</text>
<text xml:space="preserve" x="88" y="384" class="mono" font-size="24" fill="#b8ec87"> │        ❯   laintas</text>
<text xml:space="preserve" x="88" y="413" class="mono" font-size="24" fill="#b8ec87"> ╰────   ╱</text>
<text x="90" y="457" class="mono" font-size="13" fill="#8f9888">cli  ·  agent main</text>
<text x="86" y="506" font-size="17" fill="#d5d9cd">让 L 与提示符组成标记，右侧用小写字标。</text>
<text x="86" y="537" font-size="14" fill="#909a87">3 行 · 短而清晰 · 可延伸为状态栏标记</text>
<rect x="760" y="212" width="660" height="351" rx="8" fill="#171b17" stroke="#30372c"/>
<text x="786" y="252" font-size="15" fill="#e8e7e2" class="mono">02</text>
<text x="825" y="253" font-size="24" fill="#eaece5">像素字标</text>
<text x="786" y="285" font-size="15" fill="#a2aa9b">醒目 · 适合强调 CLI 的开场</text>
<path d="M786 306H1394" stroke="#30372c"/>
<text xml:space="preserve" x="788" y="355" class="mono" font-size="17" fill="#e8e7e2">█    ▄▀▀▄ ▀█▀ █▄  █ ▀▀█▀▀ ▄▀▀▄ ▄▀▀▀</text>
<text xml:space="preserve" x="788" y="384" class="mono" font-size="17" fill="#e8e7e2">█    █▄▄█  █  █ ▀▄█   █   █▄▄█  ▀▀▄</text>
<text xml:space="preserve" x="788" y="413" class="mono" font-size="17" fill="#e8e7e2">█▄▄▄ █  █ ▄█▄ █   █   █   █  █ ▄▄▄▀</text>
<text x="790" y="457" class="mono" font-size="13" fill="#8f9888">cli  ·  agent main</text>
<text x="786" y="506" font-size="17" fill="#d5d9cd">保留完整名称，以更实的笔画建立记忆点。</text>
<text x="786" y="537" font-size="14" fill="#909a87">3 行 · 黑白也醒目 · 更有终端工具的气质</text>
<rect x="60" y="597" width="660" height="351" rx="8" fill="#171b17" stroke="#30372c"/>
<text x="86" y="637" font-size="15" fill="#82cbd0" class="mono">03</text>
<text x="125" y="638" font-size="24" fill="#eaece5">精修线体</text>
<text x="86" y="670" font-size="15" fill="#a2aa9b">克制 · 延续现有字标</text>
<path d="M86 691H694" stroke="#30372c"/>
<text xml:space="preserve" x="88" y="740" class="mono" font-size="17" fill="#82cbd0">╷    ╭─╮  ╷  ╷ ╷  ╺┳╸  ╭─╮  ╭─╮</text>
<text xml:space="preserve" x="88" y="769" class="mono" font-size="17" fill="#82cbd0">│    ├─┤  │  │╲│   ┃   ├─┤  ╰─╮</text>
<text xml:space="preserve" x="88" y="798" class="mono" font-size="17" fill="#82cbd0">╰──  ╵ ╵  ╵  ╵ ╵   ╵   ╵ ╵  ╰─╯</text>
<text x="90" y="842" class="mono" font-size="13" fill="#8f9888">cli  ·  agent main</text>
<text x="86" y="891" font-size="17" fill="#d5d9cd">调整字距与横竖笔画，保留熟悉的视觉性格。</text>
<text x="86" y="922" font-size="14" fill="#909a87">3 行 · 变化温和 · 适合直接升级当前开屏</text>
<rect x="760" y="597" width="660" height="351" rx="8" fill="#171b17" stroke="#30372c"/>
<text x="786" y="637" font-size="15" fill="#d8b58a" class="mono">04</text>
<text x="825" y="638" font-size="24" fill="#eaece5">工具铭牌</text>
<text x="786" y="670" font-size="15" fill="#a2aa9b">极简 · 让工作区成为主角</text>
<path d="M786 691H1394" stroke="#30372c"/>
<text xml:space="preserve" x="788" y="740" class="mono" font-size="20" fill="#d8b58a">┌─────────────────────────────┐</text>
<text xml:space="preserve" x="788" y="769" class="mono" font-size="20" fill="#d8b58a">│  L&gt;  laintas                │</text>
<text xml:space="preserve" x="788" y="798" class="mono" font-size="20" fill="#d8b58a">└─────────────────────────────┘</text>
<text x="790" y="842" class="mono" font-size="13" fill="#8f9888">cli  ·  agent main</text>
<text x="786" y="891" font-size="17" fill="#d5d9cd">名称收进一块窄铭牌，像工具上的产品刻印。</text>
<text x="786" y="922" font-size="14" fill="#909a87">3 行 · 边界明确 · 窄终端也容易排版</text>
<path d="M64 1010H1416" stroke="#30372c"/>
<text x="64" y="1047" font-size="17" fill="#b8ec87">首选 01</text>
<text x="160" y="1047" font-size="17" fill="#b8beaf">开屏用完整组合，状态栏只保留 L&gt;。统一颜色、字距与留白，形成一套识别。</text>
<text x="64" y="1081" font-size="13" fill="#6f7d65">MONOSPACE FIRST · 单色可用 · 无需图片协议 · 最终以真实终端字体校准</text>
</svg>