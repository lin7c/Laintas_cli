<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!--
  Context budget page — shared by Helpwo and laintas_cli.
  Source of truth: Helpwo/src/context/budget-tuner.html. laintas_cli keeps a
  byte-identical copy (context_policy/budget_page.html); edit here, copy there.
  Helpwo writes it to the hidden workspace file .budget.html and shows it in
  its preview, where "Apply" hands the settings back to Helpwo; the CLI writes
  a file for any browser and downloads a .config for `/config import`.
-->
<style>
:root{
  --bg:#f3f4f6;--panel:#ffffff;--panel2:#f7f8fa;--ink:#15171c;--dim:#606774;--faint:#99a0ac;--line:#e3e6eb;--line2:#d3d8df;
  --accent:#3b6ef5;--accent-soft:#e9effe;--ok:#1f9d63;--cut:#e0464b;--cut-soft:#fdecec;--warn:#c9761a;--warn-soft:#fdf2e3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-helpwo-theme="light"]){
  --bg:#0e1014;--panel:#161920;--panel2:#1b1f27;--ink:#e8eaef;--dim:#9aa2b0;--faint:#687080;--line:#262b34;--line2:#333946;
  --accent:#7196ff;--accent-soft:#1b2542;--cut-soft:#3a1c1f;--warn-soft:#382813;--shadow:none;color-scheme:dark;
}}
:root[data-helpwo-theme="dark"]{
  --bg:#0e1014;--panel:#161920;--panel2:#1b1f27;--ink:#e8eaef;--dim:#9aa2b0;--faint:#687080;--line:#262b34;--line2:#333946;
  --accent:#7196ff;--accent-soft:#1b2542;--cut-soft:#3a1c1f;--warn-soft:#382813;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* ── header ───────────────────────────────────────────────────────── */
header.top{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:200px}
.brand h1{font-size:15.5px;margin:0}
.brand .meta{font-size:12px;color:var(--dim)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;padding:3px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);min-width:96px}
.stat .k{font-size:11px;color:var(--dim)} .stat .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.bad .v{color:var(--cut)} .stat.good .v{color:var(--ok)}
.stat .d{font-size:11px;font-weight:600;margin-left:5px}
.up{color:var(--ok)} .down{color:var(--cut)}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){color:#fff;filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ── three panes ──────────────────────────────────────────────────── */
.app{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 360px;position:relative}
.app.notree{grid-template-columns:0 minmax(0,1fr) 360px}
.pane{min-height:0;overflow:auto}
nav.tree{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.app.notree nav.tree{visibility:hidden;border:0}
.treehead{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;font-weight:650;font-size:13px;position:sticky;top:0;background:var(--panel);z-index:1}
.treehead .sp{flex:1}
.treehead label{font-weight:400;font-size:11.5px;color:var(--dim);display:flex;gap:4px;align-items:center;cursor:pointer}
.trow{display:flex;align-items:center;gap:6px;height:27px;padding:0 10px 0 calc(8px + var(--ind) * 14px);cursor:pointer;font-size:12.5px;border-left:2px solid transparent;white-space:nowrap;user-select:none}
.trow:hover{background:var(--panel2)}
.trow.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.trow.viewing .tname{font-weight:700}
.trow.absent{color:var(--faint)}
.caret{width:14px;flex:none;text-align:center;color:var(--dim);font-size:10px;border:0;background:none;padding:0;height:20px}
.caret.none{visibility:hidden}
.tsw{width:9px;height:9px;border-radius:2px;flex:none}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tpct{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;min-width:38px;text-align:right}
.ttok{color:var(--faint);font-variant-numeric:tabular-nums;font-size:11px;min-width:40px;text-align:right}
.tdot{width:6px;height:6px;border-radius:50%;flex:none}
.tdot.cut{background:var(--cut)} .tdot.contains{background:var(--warn)}
section.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{flex:none;display:flex;align-items:center;gap:6px;padding:10px 16px 8px;flex-wrap:wrap}
.tb{border:1px solid var(--line2);background:var(--panel);border-radius:7px;height:28px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px}
.tb:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tb:disabled{opacity:.4;cursor:default}
.tb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-left:4px;font-size:13px;min-width:0}
.crumbs button{border:0;background:none;padding:2px 5px;border-radius:5px;color:var(--accent)}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs .here{font-weight:700;padding:2px 5px}
.crumbs .sep{color:var(--faint)}
.toolbar .hint{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.viewhead{flex:none;padding:0 16px 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.viewhead .t{font-size:17px;font-weight:700}
.viewhead .s{font-size:12px;color:var(--dim)}
.viewhead .s b{color:var(--ink)}
/* ── the partition canvas: blocks inside blocks ──────────────────── */
.canvas{position:relative;flex:1;min-height:320px;margin:0 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);overflow:hidden;user-select:none}
.band{position:absolute;left:0;right:0;overflow:hidden;cursor:pointer}
.band>.bg{position:absolute;inset:0;background:var(--c);opacity:.10;pointer-events:none}
.band:hover>.bg{opacity:.17}
.band.d0{box-shadow:inset 4px 0 0 var(--c)}
.band.d1,.band.d2{left:12px;right:6px;border-radius:7px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.band.d1>.bg{opacity:.14} .band.d2>.bg{opacity:.2}
.band.fixed>.bg{opacity:.07;background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--faint) 30%,transparent) 6px 12px)}
.band.free{cursor:default}
.band.free>.bg{opacity:0}
.band.free.d0{box-shadow:none;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line2) 55%,transparent) 8px 9px)}
.band.sel{z-index:2}
.band.sel::after{content:"";position:absolute;inset:0;border:2px solid var(--c);border-radius:inherit;pointer-events:none}
.hd{position:relative;display:flex;align-items:center;gap:8px;height:28px;padding:0 12px 0 14px;font-size:13px;white-space:nowrap}
.d1>.hd,.d2>.hd{height:21px;padding:0 8px;font-size:11.5px;gap:6px}
.hd .sw{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}
.hd .nm{font-weight:650;overflow:hidden;text-overflow:ellipsis;min-width:0}
.d2>.hd .nm{font-weight:550}
.hd .tok{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.hd .pct{margin-left:auto;font-weight:750;font-variant-numeric:tabular-nums;font-size:14.5px}
.d1>.hd .pct,.d2>.hd .pct{font-size:11.5px;font-weight:650}
.meter{position:relative;width:54px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,transparent);overflow:hidden;flex:none}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.meter.over{background:color-mix(in srgb,var(--cut) 25%,transparent)} .meter.over i{background:var(--cut)}
.d2 .meter,.d2 .tok{display:none}
.pill{font-size:10.5px;font-weight:700;padding:0 7px;border-radius:999px;line-height:17px;white-space:nowrap}
.pill.cut{background:var(--cut);color:#fff} .pill.contains{background:var(--warn-soft);color:var(--warn)}
.pill.fixed{background:var(--panel);color:var(--dim);border:1px solid var(--line2)} .pill.absent{background:var(--panel2);color:var(--faint)}
.pill.pin{background:var(--accent-soft);color:var(--accent)}
.d2 .pill{display:none}
.enter{border:1px solid var(--line2);background:var(--panel);border-radius:6px;font-size:11.5px;line-height:18px;padding:0 7px;color:var(--accent)}
.enter:hover{background:var(--accent-soft)}
.band.tiny>.hd{height:100%;min-height:0}
.band.tiny>.hd .tok,.band.tiny>.hd .meter,.band.tiny>.hd .pill,.band.tiny>.hd .enter{display:none}
.band.micro>.hd{visibility:hidden}
.inner{position:absolute;left:0;right:0;bottom:6px}
.divider{position:absolute;left:0;right:0;height:0;z-index:5}
.divider::before{content:"";position:absolute;left:0;right:0;top:-1px;border-top:2px solid color-mix(in srgb,var(--ink) 50%,transparent)}
.divider.fixedline::before{border-top:1px dashed var(--line2)}
.divider .grip{position:absolute;left:50%;top:-9px;transform:translateX(-50%);width:52px;height:18px;border-radius:9px;background:var(--panel);border:1px solid var(--line2);box-shadow:var(--shadow);cursor:row-resize;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.divider .grip i{width:18px;height:2px;border-radius:1px;background:var(--dim);display:block}
.divider .grip:hover,.divider.drag .grip{border-color:var(--accent);background:var(--accent-soft)}
.divider .hit{position:absolute;left:0;right:0;top:-6px;height:12px;cursor:row-resize}
.dragtip{position:absolute;right:14px;z-index:8;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 9px;border-radius:7px;pointer-events:none;font-variant-numeric:tabular-nums;transform:translateY(-50%);white-space:nowrap}
.legend{flex:none;display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px 12px;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:16px;height:7px;border-radius:2px;margin-right:5px;vertical-align:1px}
/* ── inspector ────────────────────────────────────────────────────── */
aside.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h2,.sec summary{font-size:13px;margin:0;font-weight:650;display:flex;align-items:center;gap:8px}
.sec summary{cursor:pointer;list-style:none}
.sec summary::-webkit-details-marker{display:none}
.sec summary::before{content:"▸";color:var(--faint);font-size:11px}
details[open]>summary::before{content:"▾"}
.sec summary .sp,.sec h2 .sp{flex:1}
.ihead{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.ihead .sw{width:11px;height:11px;border-radius:3px;flex:none}
.ipath{font:11.5px var(--mono);color:var(--faint);margin-top:2px;word-break:break-all}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px;margin:10px 0 4px}
.kv .k{color:var(--dim)} .kv .v{font-variant-numeric:tabular-nums}
.share{margin-top:10px;padding:10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.share .lbl{font-size:12px;color:var(--dim);margin-bottom:6px}
.share .ctl{display:flex;align-items:center;gap:8px}
.share input[type=range]{flex:1;accent-color:var(--c,var(--accent));min-width:0}
.num{width:66px;text-align:right;border:1px solid var(--line2);border-radius:7px;background:var(--panel);padding:2px 6px;font-variant-numeric:tabular-nums}
.num:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.lock{border:1px solid var(--line2);background:var(--panel);border-radius:7px;height:26px;padding:0 7px;font-size:12px;color:var(--dim);white-space:nowrap}
.lock.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.note.warn{color:var(--warn)}
.note.warn:empty{display:none}
.adv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:12.5px;margin-top:8px}
.adv input[type=number],.adv select{border:1px solid var(--line2);border-radius:7px;background:var(--panel2);padding:3px 7px;width:100%}
.adv input[type=range]{width:100%;accent-color:var(--accent)}
.adv .full{grid-column:1 / -1}
.kids{margin-top:8px;display:flex;flex-direction:column;gap:2px}
.kid{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 6px;border-radius:6px;cursor:pointer}
.kid:hover{background:var(--panel2)}
.kid .tpct{margin-left:auto}
.tabs{display:flex;gap:4px;margin:8px 0 6px}
.tab{border:1px solid var(--line2);background:var(--panel2);border-radius:7px;padding:2px 10px;font-size:12px}
.tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.textmap{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;max-height:min(52vh,520px);overflow:auto;font:12px/1.55 var(--mono);margin:6px 0 0}
.textmap .k{background:color-mix(in srgb,var(--c) 24%,transparent);border-radius:2px}
.textmap .t{background:color-mix(in srgb,var(--c) 9%,transparent)}
.textmap .x{color:var(--faint);opacity:.7}
.tlegend{display:flex;gap:12px;font-size:11.5px;color:var(--dim);flex-wrap:wrap}
.tlegend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chg{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.chg:last-child{border-bottom:0}
.chg .what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chg .from{color:var(--faint);text-decoration:line-through;font-variant-numeric:tabular-nums}
.chg .to{color:var(--accent);font-weight:650;font-variant-numeric:tabular-nums}
.link{border:0;background:none;color:var(--accent);font-size:12px;padding:0}
.err{color:var(--cut);font-size:12px;margin-top:6px}
.err:empty{display:none}
.hint{font-size:12px;color:var(--dim)}
.toolgrid{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;font-size:12px;margin-top:8px}
.toolgrid .drop{color:var(--cut);text-decoration:line-through}
.thbar{position:relative;height:18px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);margin:12px 0 30px}
.thbar .used{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:color-mix(in srgb,var(--ok) 45%,transparent)}
.thbar .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.thbar .mk span{position:absolute;top:24px;left:-40px;width:80px;text-align:center;font-size:10.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:80vw}
.toast.show{opacity:.96}
.empty{padding:14px 0;color:var(--dim);font-size:12.5px}
/* narrower: the tree becomes a drawer over the canvas */
@media (max-width:1100px){
  .app,.app.notree{grid-template-columns:minmax(0,1fr) 330px}
  nav.tree{position:absolute;left:0;top:0;bottom:0;width:260px;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .app.notree nav.tree{display:none}
  .toolbar .hint{display:none}
}
@media (max-width:760px){
  body{overflow:auto;height:auto}
  .app,.app.notree{display:block}
  .canvas{height:440px;flex:none}
  aside.side{border-left:0;border-top:1px solid var(--line)}
  nav.tree{position:fixed}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1 id="title"></h1><div class="meta" id="meta"></div></div>
  <div class="stats" id="stats"></div>
  <div class="actions"><button class="btn" id="undo-all"></button><button class="btn primary" id="primary"></button></div>
</header>
<div class="app" id="app">
  <nav class="tree pane" id="tree"></nav>
  <section class="stage">
    <div class="toolbar" id="toolbar"></div>
    <div class="viewhead" id="viewhead"></div>
    <div class="canvas" id="canvas"></div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="side pane">
    <div class="sec" id="inspector"></div>
    <details class="sec" id="changes-wrap" open><summary id="changes-title"></summary><div id="changes"></div></details>
    <details class="sec" id="advanced"><summary id="adv-title"></summary><div id="adv-body"></div></details>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const CLI = D.mode === "cli";
const $ = (id) => document.getElementById(id);

// ── Words ────────────────────────────────────────────────────────────────
const ZH = {
  title: "上下文预算", request: "请求", captured: "采集于", window: "窗口", model: "模型",
  stats: {cut: "将被压缩", saved: "省略", conv: "对话实际可用"}, blocks: (n) => `${n} 个块`,
  apply: "应用到 Helpwo", applyNeedsHelpwo: "请在 Helpwo 设置里点「预算」打开此页，再应用", download: "下载 .config",
  undo: "撤销修改", defaults: "恢复出厂默认",
  nav: {back: "后退", up: "上一级", enter: "进入", tree: "结构树", hint: "单击选中 · 双击进入 · Backspace 返回上一级"},
  overview: "概览", root: "上下文窗口", input: "输入预算", output: "输出预留", conv: CLI ? "对话历史" : "对话与工具",
  untagged: "未标注文本", free: "空闲",
  viewSum: (b, c) => `预算 <b>${b}</b> · 内容 <b>${c}</b>`, viewWhole: (w) => `整个窗口 <b>${w}</b> · 双击进入`,
  pill: {cut: "将被压缩", contains: "子块压缩", fixed: "🔒 不压缩", absent: "本次未出现", pin: "已锁定"},
  moreFields: "更多参数（保底 / 超出时 / 原始权重）", treeTitle: "结构树", showAbsent: "显示未出现的块", treeCols: "占父块 · tokens",
  quota: "份额", content: "内容", sent: "预计发送", atCapture: "采集时", ofParent: (n) => `占「${n}」的比例`,
  flexOf: (n) => `在「${n}」可分配部分中的比例`, lock: "锁定", lockTip: "锁定后，调整其它块时这个块的比例保持不变",
  lockedDrag: "这条分割线旁边有锁定的块，先解锁再拖动",
  floor: "保底 tokens", shrink: "超出时", share: "原始权重",
  shrinkNames: {none: "不压缩", truncate: "保留开头", tail: "保留结尾", drop: "整块丢弃", narrow: "按工具裁剪", compact: "对话压缩"},
  fixedNote: "这个块按实际大小占用，不参与比例分配，也不会被压缩。",
  untaggedNote: "父块里没有被标签包住的文字，按实际大小占用，始终完整发送。",
  freeNote: "份额里没有被内容用掉的部分。父块没超出时，子块不受比例约束。",
  outputEff: (set, eff) => `设定 ${set} · 实际 ${eff}`,
  reasons: {floor: (m) => `低于保底 ${m} tokens，按保底计（可在下面的更多参数里调低保底）`, cap: (m) => `受模型最大输出 ${m} tokens 限制，再调大不会生效`, window: () => "不能超过整个窗口",
    pinned: (f, c) => `保底 ${f} tokens 高于模型最大输出 ${c}，输出预留固定为 ${c}；拖动或调小比例会一并降低保底`},

const toolRows = (items) => items.map((i) => `<span class="${toolKeep && !toolKeep.has(i.name) ? "drop" : ""}">${esc(i.name)}</span><span class="hint">${i.core ? esc(L.core) : ""}</span><span style="text-align:right">${fmt(i.tokens)}</span>`).join("");
function toolsSection() {
  const items = (B.tools && B.tools.items) || [];
  if (!items.length) return "";
  return `<div class="note" id="ins-tools-kept">${esc(L.toolsKept(toolKeep ? toolKeep.size : items.length, items.length))}</div>
    <div class="toolgrid" id="ins-tools">${toolRows(items)}</div>`;
}
function renderInspector() {
  const id = selected, st = stateOf(id);
  const note = id === "@" || id === "" ? L.rootNote : id === "input" ? L.inputNote : id === "thread" ? L.convNote
    : id.endsWith("#rest") ? L.untaggedNote : id.endsWith("#free") ? L.freeNote : isBlock(id) && B[id] && shrinkOf(id) === "none" ? L.fixedNote : "";
  const scroll = $("ins-text") ? $("ins-text").scrollTop : 0;
  $("inspector").innerHTML = `<div class="ihead"><span class="sw" style="background:${colorOf(id)}"></span>${esc(nameOf(id))}${st && st !== "fixed" ? ` <span class="pill ${st}">${esc(L.pill[st])}</span>` : ""}</div>
    ${isBlock(id) ? `<div class="ipath">${esc(id)}</div>` : ""}
    <div class="kv" id="ins-kv">${kvHTML(id)}</div>
    ${note ? `<div class="note">${esc(note)}</div>` : ""}
    ${id === "thread" ? `<div class="note" id="ins-conv">${esc(L.convActual(fmt(T.rest)))}</div>` : ""}
    ${shareBlock(id)}${advancedFields(id)}
    ${id === "thread" ? threadSection() : ""}${id === "tools" ? toolsSection() : ""}
    ${!Object.keys(B).length ? `<div class="empty">${esc(L.empty)}</div>` : ""}
    ${kidsSection(id)}${textSection(id)}`;
  if ($("ins-text") && renderInspector.last === id) $("ins-text").scrollTop = scroll;
  renderInspector.last = id;
  refreshThreadError();
}
// After a value changed: numbers and the text map in place. The control
// being dragged or typed into is left alone, or the drag would end.
let textFrame = 0;
function refreshInspector() {
  const id = selected, kv = $("ins-kv");
  if (!kv) return;
  kv.innerHTML = kvHTML(id);
  const range = $("ins-range"), num = $("ins-num");
  if (range && editableKind(id)) {
    const v = (shareValue(id) * 100).toFixed(1);
    if (document.activeElement !== range) range.value = v;
    if (document.activeElement !== num) num.value = v;
    $("ins-note").textContent = shareNote(id);
  }
  const conv = $("ins-conv"); if (conv) conv.textContent = L.convActual(fmt(T.rest));
  const kept = $("ins-tools-kept");
  if (kept && B.tools) { const items = B.tools.items || []; kept.textContent = L.toolsKept(toolKeep ? toolKeep.size : items.length, items.length); $("ins-tools").innerHTML = toolRows(items); }
  document.querySelectorAll(".kid[data-reveal]").forEach((el) => {
    const hit = partIn(el.dataset.reveal), span = el.querySelector(".tpct");
    if (hit && span) span.textContent = hit.part.kind === "free" ? fmt(hit.part.tokens) : pctText(pctOf(hit.part, hit.level));
  });
  const pre = $("ins-text");
  if (pre && tab === "now" && B[id]) {
    cancelAnimationFrame(textFrame);
    textFrame = requestAnimationFrame(() => { const top = pre.scrollTop; pre.innerHTML = textMapHTML(id); pre.scrollTop = top; });
  }
  refreshThreadError();
}
function refreshThreadError() { const e = $("ins-err"); if (e) e.textContent = compactError(); }

// ── Changes, export, advanced ─────────────────────────────────────────
function changes() {
  const out = [];
  for (const p of Object.keys(cfg)) for (const l of Object.keys(cfg[p])) if (cfg[p][l] !== initial[p][l]) out.push({p, l, from: initial[p][l], to: cfg[p][l]});
  for (const k of Object.keys(scal)) if (scal[k] !== scalInit[k]) out.push({p: "", l: k, from: scalInit[k], to: scal[k]});
  return out;
}
function profile() { // Helpwo: every value that differs from the shipped defaults
  const out = {};
  for (const p of Object.keys(cfg)) for (const l of Object.keys(cfg[p])) if (cfg[p][l] !== def[p][l]) out[`budget.${p}.${l}`] = cfg[p][l];
  for (const k of Object.keys(scal)) if (scal[k] !== scalDef[k]) out[`budget.${k}`] = scal[k];
  return out;
}
function configText() { // laintas_cli: one /config line per setting changed on this page
  const lines = [D.exportHeader || "# laintas-cli settings", `# from the budget page: request #${D.request}, ${D.model || "model"}, window ${D.window || "?"}`];
  for (const c of changes().sort((a, b) => (a.p + "." + a.l).localeCompare(b.p + "." + b.l))) lines.push(`budget ${c.p ? c.p.replace(/\./g, " ") + " " : ""}${c.l} ${c.to}`);
  return lines.join("\n") + "\n";
}
function compactError() {
  const th = cfg.thread || {};
  if (!CLI || ["compact_target", "compact_background", "compact_foreground"].some((k) => typeof th[k] !== "number")) return "";
  return th.compact_target < th.compact_background && th.compact_background < th.compact_foreground && th.compact_foreground <= 1 ? "" : L.compactOrder;
}
const showVal = (l, v) => l === "shrink" ? (L.shrinkNames[v] || v) : l === "min" || /window/.test(l) ? fmt(v) : typeof v === "number" && v <= 1 ? pctText(v) : v;
const fieldName = (l, p) => l === "share" ? (p && parentOf(p) ? L.share : L.pctWord) : l === "min" ? L.floor : l === "shrink" ? L.shrink : (L.threadMarks[l] || "");
const canApply = () => !CLI && !!D.applyToken && window.parent !== window;
function renderChanges() {
  const list = changes(), err = compactError();
  $("changes-title").innerHTML = `${esc(L.changes)} <span class="hint">${list.length || ""}</span><span class="sp"></span><button class="link" data-act="defaults">${esc(L.defaults)}</button>`;
  $("changes").innerHTML = (list.length ? list.map((c, i) => `<div class="chg"><span class="what" data-reveal="${esc(c.p)}">${esc(c.p ? nameOf(c.p) : (c.l === "hysteresis" ? L.hysteresis : (L.scalarNames[c.l] || c.l)))}${fieldName(c.l, c.p) ? " · " + esc(fieldName(c.l, c.p)) : ""}</span><span class="from">${esc(showVal(c.l, c.from))}</span>→<span class="to">${esc(showVal(c.l, c.to))}</span><button class="link" data-undo="${i}">↺</button></div>`).join("")
    : `<div class="hint" style="margin-top:6px">${esc(L.noChanges)}</div>`) + (err ? `<div class="err">${esc(err)}</div>` : "");
  const primary = $("primary");
  primary.disabled = !!err || (CLI ? !list.length : !canApply());
  primary.title = !CLI && !canApply() ? L.applyNeedsHelpwo : "";
  $("undo-all").disabled = !list.length;
}
function renderAdvanced() {
  $("adv-title").textContent = L.advanced;
  const rows = Object.keys(scal).map((k) => k === "hysteresis"
    ? `<span data-label="s:${k}">${esc(L.hysteresis)} · ${pctText(scal[k])}</span><input type="range" min="0.5" max="1" step="0.01" value="${scal[k]}" data-s="${k}"><span class="hint full">${esc(L.hysteresisDesc)}</span>`
    : `<span>${esc(L.scalarNames[k] || k)}</span><input type="number" min="0" step="${k === "chars_per_token" ? 0.1 : 1024}" value="${scal[k]}" data-s="${k}">`).join("");
  const aux = CLI ? Object.keys(cfg).filter((k) => topOf(k) === "aux" && "share" in cfg[k]) : [];
  $("adv-body").innerHTML = `<div class="adv">${rows}</div>` +
    (aux.length ? `<h2 style="margin-top:14px;font-size:12.5px">${esc(L.aux)}</h2><div class="adv">${aux.map((k) => `<span data-label="${k}">${esc(k.slice(4).split(".").map((s) => L.names[s] || s).join(" · "))} · ${pctText(share(k))}</span><input type="range" min="0" max="0.5" step="0.001" value="${share(k)}" data-p="${k}" data-l="share">`).join("")}</div>` : "");
}
// After a value changed; the inspector refreshes in place.
function renderLive() { compute(); renderHeader(); renderToolbar(); renderCanvas(); renderTree(); renderChanges(); refreshInspector(); }
function renderAll() { compute(); renderHeader(); renderToolbar(); renderCanvas(); renderTree(); renderChanges(); renderInspector(); }

// ── Interaction ────────────────────────────────────────────────────────
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 3000); }
let justDragged = false;
document.addEventListener("click", (e) => {
  const t = e.target;
  if (justDragged) { justDragged = false; return; }
  if (t.closest("[data-drag]")) return;
  const act = t.closest("[data-act]");
  if (act && act.tagName !== "INPUT") {
    const a = act.dataset.act;
    if (a === "tree") { treeShown = !treeShown; renderToolbar(); requestAnimationFrame(renderCanvas); }
    else if (a === "back") back();
    else if (a === "up") up();
    else if (a === "enter") enter(selected);
    else if (a === "defaults") { e.preventDefault(); for (const p in cfg) Object.assign(cfg[p], def[p]); Object.assign(scal, scalDef); renderAll(); renderAdvanced(); }
    return;
  }
  const el = t.closest("[data-go],[data-enter],[data-caret],[data-tree],[data-reveal],[data-lock],[data-tab],[data-undo],#undo-all,#primary");
  if (el) {
    if (el.dataset.go !== undefined) return go(el.dataset.go, el.dataset.go);
    if (el.dataset.enter !== undefined) return enter(el.dataset.enter);
    if (el.dataset.caret !== undefined) { const id = el.dataset.caret; expanded.has(id) ? expanded.delete(id) : expanded.add(id); return renderTree(); }
    if (el.dataset.tree !== undefined) return reveal(el.dataset.tree);
    if (el.dataset.reveal !== undefined) { if (el.dataset.reveal) reveal(el.dataset.reveal); return; }
    if (el.dataset.lock) { const id = el.dataset.lock; locks.has(id) ? locks.delete(id) : locks.add(id); renderAll(); return; }
    if (el.dataset.tab) { tab = el.dataset.tab; renderInspector(); return; }
    if (el.dataset.undo !== undefined) { const c = changes()[+el.dataset.undo]; if (c) { if (c.p) cfg[c.p][c.l] = c.from; else scal[c.l] = c.from; renderAll(); renderAdvanced(); } return; }
    if (el.id === "undo-all") { for (const p in cfg) Object.assign(cfg[p], initial[p]); Object.assign(scal, scalInit); renderAll(); renderAdvanced(); return; }
    if (el.id === "primary") return primary();
  }
  const band = t.closest(".band");
  if (band && !t.closest("button,input,select") && !band.dataset.id.endsWith("#free")) select(band.dataset.id);
});
document.addEventListener("dblclick", (e) => {
  if (e.target.closest("button,input,select,[data-drag]")) return;
  const band = e.target.closest(".band");
  if (band) { e.preventDefault(); if (!band.dataset.id.endsWith("#free")) enter(band.dataset.id); return; }
  const row = e.target.closest("[data-tree]");
  if (row) enter(row.dataset.tree);
});
function primary() {
  if (CLI) {
    const url = URL.createObjectURL(new Blob([configText()], {type: "text/plain"}));
    const a = document.createElement("a"); a.href = url; a.download = `budget-${D.request}.config`; a.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
  } else if (canApply()) {
    window.parent.postMessage({type: "helpwo:budget-apply", token: D.applyToken, values: profile()}, D.origin || "*");
  }
}
document.addEventListener("keydown", (e) => {
  if (e.target.closest && e.target.closest("input,select,textarea")) return;
  if (e.key === "Backspace" || (e.altKey && e.key === "ArrowUp")) { e.preventDefault(); up(); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); back(); }
  else if (e.key === "Enter" && selected !== view) { e.preventDefault(); enter(selected); }
  else if (e.key === "Escape") { select(view); }
  else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && LEVEL) {
    const ids = LEVEL.parts.map((p) => p.id).filter((id) => !id.endsWith("#free"));
    if (!ids.length) return;
    e.preventDefault();
    const i = ids.indexOf(selected), next = i < 0 ? 0 : Math.max(0, Math.min(ids.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    select(ids[next]);
  }
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "absent") { showAbsent = el.checked; renderTree(); return; }
  if (el.id === "ins-num") { applyShare(selected, (parseFloat(el.value) || 0) / 100); el.blur(); renderLive(); return; }
  if (el.id === "ins-range") { renderLive(); return; }
  if (el.dataset.s && el.type !== "range") { const v = parseFloat(el.value); if (v > 0) { scal[el.dataset.s] = el.dataset.s === "chars_per_token" ? v : Math.round(v); renderAll(); } return; }
  if (el.dataset.p && el.type !== "range") {
    const p = el.dataset.p, l = el.dataset.l;
    cfg[p][l] = l === "shrink" ? el.value : l === "min" ? Math.max(0, parseInt(el.value || "0", 10)) : Math.max(0, parseFloat(el.value || "0"));
    renderAll();
  }
});
// Sliders update the model and everything around them, but not themselves.
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "ins-range") { applyShare(selected, parseFloat(el.value) / 100); renderLive(); return; }
  if (el.type !== "range") return;
  const v = parseFloat(el.value);
  if (el.dataset.s) scal[el.dataset.s] = v; else if (el.dataset.p) cfg[el.dataset.p][el.dataset.l] = v; else return;
  const label = el.previousElementSibling;
  if (label && label.dataset.label) {
    const k = label.dataset.label;
    if (k.startsWith("s:")) label.textContent = `${L.hysteresis} · ${pctText(v)}`;
    else if (el.dataset.p === "thread") label.textContent = `${L.threadMarks[el.dataset.l]} · ${pctText(v)}`;
    else if (topOf(k) === "aux") label.textContent = `${k.slice(4).split(".").map((s) => L.names[s] || s).join(" · ")} · ${pctText(v)}`;
    else label.textContent = `${nameOf(k)} · ${pctText(v)} ≈ ${fmt(Math.max(minOf(k), v * (T.rest || 1)))}`;
  }
  if (el.dataset.p === "thread") { const mk = document.querySelector(`.mk[data-mk="${el.dataset.l}"]`); if (mk) { mk.style.left = 100 * v + "%"; mk.querySelector("span").innerHTML = `${esc(L.threadMarks[el.dataset.l])}<br>${pctText(v)}`; } }
  compute(); renderHeader(); renderChanges(); refreshThreadError();
});
// Divider dragging: the two neighbours trade share; nothing else moves.
let dragging = null;
document.addEventListener("pointerdown", (e) => {
  const g = e.target.closest("[data-drag]"); if (!g || !LEVEL) return;
  const level = LEVEL, i = +g.dataset.drag, a = level.parts[i], b = level.parts[i + 1];
  if (locks.has(a.id) || locks.has(b.id)) { toast(L.lockedDrag); e.preventDefault(); return; }
  const snapshot = {}; for (const p of level.parts) if (cfg[p.id]) snapshot[p.id] = share(p.id);
  const outMin = cfg.output ? cfg.output.min : undefined;
  dragging = {view, a: a.id, b: b.id, akind: a.kind, bkind: b.kind, y0: e.clientY, H: $("canvas").clientHeight, snapshot, outMin,
    outBase: T.output / (T.win || 1),
    pa: level.mode === "flex" ? flexPct(level)[a.id] : share(a.id), i, total: level.total, remaining: level.plan ? level.plan.remaining : 0};
  e.preventDefault();
});
document.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const g = dragging;
  for (const [p, v] of Object.entries(g.snapshot)) cfg[p].share = v; // re-apply from the start: the move is absolute
  if (g.outMin !== undefined) cfg.output.min = g.outMin;
  compute();
  const level = partsOf(g.view), dTokens = (e.clientY - g.y0) / g.H * (g.total || 1);
  if (level.mode === "flex") setFlex(level, g.a, g.pa + dTokens / (g.remaining || 1), g.b);
  else {
    const d = dTokens / (g.total || 1);
    if (g.akind === "abs" && g.bkind === "abs") setAbs(level, g.a, share(g.a) + d, g.b);
    else if (g.a === "output") setOutput(g.outBase + d);
    else if (g.akind === "abs") setAbs(level, g.a, share(g.a) + d, "rest");
    else if (g.bkind === "abs") setAbs(level, g.b, share(g.b) - d, "rest");
  }
  justDragged = Math.abs(e.clientY - g.y0) > 2;
  renderLive();
  const tip = $("dragtip"), lv = LEVEL, na = lv.parts.find((p) => p.id === g.a), nb = lv.parts.find((p) => p.id === g.b);
  if (tip && na && nb) {
    tip.hidden = false; tip.style.top = nb._y + "px";
    const pinned = g.a === "output" && atCap() ? `  · ${L.capTip(fmt(T.outputCap))}` : "";
    tip.textContent = `${nameOf(na.id)} ${pctText(pctOf(na, lv))}  ·  ${nameOf(nb.id)} ${pctText(pctOf(nb, lv))}${pinned}`;
  }
  const div = document.querySelector(`.divider[data-i="${g.i}"]`); if (div) div.classList.add("drag");
});
document.addEventListener("pointerup", () => {
  if (!dragging) return;
  dragging = null; renderAll();
  setTimeout(() => { justDragged = false; }, 0);
});
window.addEventListener("message", (e) => {
  const d = e.data;
  if (window.parent === window || e.source !== window.parent || !d) return;
  if (d.type === "helpwo:lang-sync") {
    const next = d.lang === "CN" ? ZH : EN;
    if (next !== L) { L = next; document.documentElement.lang = L === ZH ? "zh-CN" : "en"; renderAll(); renderAdvanced(); }
  } else if (d.type === "helpwo:budget-applied") {
    toast(d.ok ? L.applied(d.count) : d.code === "stale-page" ? L.stalePage : L.applyFail + (d.error || ""));
    if (d.ok) { for (const p in cfg) Object.assign(initial[p], cfg[p]); Object.assign(scalInit, scal); renderAll(); }
  }
});
let resizeT = 0;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!dragging) renderCanvas(); }, 60); });

// ── Start: the whole window as one block ────────────────────────────────
compute();
const BASE = {cut: T.cutPaths.length, saved: T.saved, rest: T.rest};
document.documentElement.lang = L === ZH ? "zh-CN" : "en";
for (const p of T.cutPaths) for (let q = vparent(p); q !== null; q = vparent(q)) expanded.add(q);
renderAdvanced();
renderAll();
</script>
