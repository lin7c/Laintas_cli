name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "laintas_cli.py"
      - "build/windows/**"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python
        shell: pwsh
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --upgrade pip

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --prefer-binary requests certifi rich prompt-toolkit

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --prefer-binary pyinstaller

      - name: Build laintas_cli.exe
        shell: pwsh
        run: pyinstaller --noconfirm build/windows/laintas_cli.spec

      # ── Code signing (Azure Trusted Signing) ──────────────────────────────
      # Signing MUST happen before the exe is copied/zipped/checksummed, because
      # it rewrites the file (and thus its SHA256). The step is gated on the
      # signing secrets being present, so the build still succeeds (unsigned)
      # until Azure Trusted Signing is configured. To enable, add these repo
      # secrets (Settings → Secrets and variables → Actions):
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET  (service principal)
      #   AZURE_TS_ENDPOINT        e.g. https://eus.codesigning.azure.net
      #   AZURE_TS_ACCOUNT         Trusted Signing account name
      #   AZURE_TS_PROFILE         certificate profile name
      - name: Detect signing config
        id: signcfg
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          $enabled = if ($env:AZURE_CLIENT_ID) { "enabled=true" } else { "enabled=false" }
          $enabled | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $env:AZURE_CLIENT_ID) {
            Write-Host "::warning::Azure Trusted Signing secrets not set — producing an UNSIGNED exe (will trigger SmartScreen)."
          }

      - name: Sign laintas_cli.exe (Azure Trusted Signing)
        if: steps.signcfg.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        if: steps.signcfg.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist/laintas_cli.exe
          Write-Host "Signature status: $($sig.Status)"
          if ($sig.Status -ne 'Valid') { throw "Signature invalid: $($sig.Status)" }

      - name: Distribute signed exe
        shell: pwsh
        run: |
          Copy-Item dist/laintas_cli.exe build/windows/laintas_cli.exe -Force
          Copy-Item dist/laintas_cli.exe laintas_cli_download/public/releases/latest/laintas_cli.exe -Force
          Copy-Item dist/laintas_cli.exe laintas_cli_download/dist/releases/latest/laintas_cli.exe -Force

      - name: Build Windows zip
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "laintas-cli-windows"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item dist/laintas_cli.exe (Join-Path $tmp "laintas_cli.exe") -Force
          Compress-Archive -Path (Join-Path $tmp "laintas_cli.exe") -DestinationPath laintas_cli_download/public/releases/latest/laintas-cli_windows.zip -Force
          Copy-Item laintas_cli_download/public/releases/latest/laintas-cli_windows.zip laintas_cli_download/dist/releases/latest/laintas-cli_windows.zip -Force

      - name: Update checksums
        shell: pwsh
        run: |
          $release = "laintas_cli_download/public/releases/latest"
          $files = @(
            "laintas-cli_linux.tar.gz",
            "laintas-cli_macos.tar.gz",
            "laintas-cli_source.zip",
            "laintas_cli.exe",
            "laintas-cli_windows.zip",
            "laintas-cli_0.1.4_amd64.deb"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $release $file)).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content -Path (Join-Path $release "SHA256SUMS.txt") -NoNewline:$false
          Copy-Item (Join-Path $release "SHA256SUMS.txt") "laintas_cli_download/dist/releases/latest/SHA256SUMS.txt" -Force

      - name: Commit release artifacts
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/windows/laintas_cli.exe laintas_cli_download/public/releases/latest/laintas_cli.exe laintas_cli_download/public/releases/latest/laintas-cli_windows.zip laintas_cli_download/public/releases/latest/SHA256SUMS.txt laintas_cli_download/dist/releases/latest/laintas_cli.exe laintas_cli_download/dist/releases/latest/laintas-cli_windows.zip laintas_cli_download/dist/releases/latest/SHA256SUMS.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No release artifact changes to commit."
            exit 0
          }
          git commit -m "release: rebuild Windows CLI"
          git push

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laintas-cli-windows
          path: |
            dist/laintas_cli.exe
            laintas_cli_download/public/releases/latest/laintas-cli_windows.zip
            laintas_cli_download/public/releases/latest/SHA256SUMS.txt
