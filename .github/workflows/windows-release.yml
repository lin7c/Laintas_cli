name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "laintas_cli.py"
      - "build/windows/**"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build laintas_cli.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm build/windows/laintas_cli.spec
          Copy-Item dist/laintas_cli.exe build/windows/laintas_cli.exe -Force
          Copy-Item dist/laintas_cli.exe laintas_cli_download/public/releases/latest/laintas_cli.exe -Force
          Copy-Item dist/laintas_cli.exe laintas_cli_download/dist/releases/latest/laintas_cli.exe -Force

      - name: Build Windows zip
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "laintas-cli-windows"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item dist/laintas_cli.exe (Join-Path $tmp "laintas_cli.exe") -Force
          Compress-Archive -Path (Join-Path $tmp "laintas_cli.exe") -DestinationPath laintas_cli_download/public/releases/latest/laintas-cli_windows.zip -Force
          Copy-Item laintas_cli_download/public/releases/latest/laintas-cli_windows.zip laintas_cli_download/dist/releases/latest/laintas-cli_windows.zip -Force

      - name: Update checksums
        shell: pwsh
        run: |
          $release = "laintas_cli_download/public/releases/latest"
          $files = @(
            "laintas-cli_linux.tar.gz",
            "laintas-cli_macos.tar.gz",
            "laintas-cli_source.zip",
            "laintas_cli.exe",
            "laintas-cli_windows.zip",
            "laintas-cli_0.1.4_amd64.deb"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $release $file)).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content -Path (Join-Path $release "SHA256SUMS.txt") -NoNewline:$false
          Copy-Item (Join-Path $release "SHA256SUMS.txt") "laintas_cli_download/dist/releases/latest/SHA256SUMS.txt" -Force

      - name: Commit release artifacts
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/windows/laintas_cli.exe laintas_cli_download/public/releases/latest/laintas_cli.exe laintas_cli_download/public/releases/latest/laintas-cli_windows.zip laintas_cli_download/public/releases/latest/SHA256SUMS.txt laintas_cli_download/dist/releases/latest/laintas_cli.exe laintas_cli_download/dist/releases/latest/laintas-cli_windows.zip laintas_cli_download/dist/releases/latest/SHA256SUMS.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No release artifact changes to commit."
            exit 0
          }
          git commit -m "release: rebuild Windows CLI"
          git push

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laintas-cli-windows
          path: |
            dist/laintas_cli.exe
            laintas_cli_download/public/releases/latest/laintas-cli_windows.zip
            laintas_cli_download/public/releases/latest/SHA256SUMS.txt
