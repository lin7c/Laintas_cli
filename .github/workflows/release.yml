name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.7.0). If empty, reads version.py."
        required: false
        default: ""
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Enable cross-architecture containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build Linux binary
        run: bash build/linux/build_linux_compat.sh "${{ matrix.arch }}"

      - name: Stage Linux package
        run: |
          mkdir -p staging
          cp "build/linux/dist-compat/${{ matrix.arch }}/laintas-cli" staging/
          cp LICENSE staging/
          cat > staging/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          TARGET="/usr/local/bin/laintas-cli"
          if [ "$(id -u)" -eq 0 ]; then
            install -m 755 "$SCRIPT_DIR/laintas-cli" "$TARGET"
          else
            sudo install -m 755 "$SCRIPT_DIR/laintas-cli" "$TARGET"
          fi
          echo "Installed to $TARGET"
          echo "Run: laintas-cli"
          EOF
          chmod 755 staging/install.sh
          tar -C staging -czf "laintas-cli_linux_${{ matrix.arch }}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: "laintas-cli_linux_${{ matrix.arch }}.tar.gz"

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Build source package and update manifest
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, shutil, sys
          pm = json.load(open("package_manifest.json"))
          top = [m + ".py" for m in pm["modules"]] + pm["extra_files"]
          dirs = pm["packages"] + pm["data_dirs"]
          os.makedirs("bundle/laintas-cli-source", exist_ok=True)
          for f in top:
              shutil.copy(f, "bundle/laintas-cli-source/")
          for d in dirs:
              shutil.copytree(d, f"bundle/laintas-cli-source/{d}")
          os.system("cd bundle && zip -qr ../laintas-cli_source.zip laintas-cli-source")
          os.makedirs("src_out", exist_ok=True)
          for f in top:
              if os.path.isfile(f) and (f == "LICENSE" or f.endswith((".py", ".json", ".txt"))):
                  shutil.copy(f, "src_out/")
          for d in dirs:
              if os.path.isdir(d):
                  for root, subdirs, files in os.walk(d):
                      subdirs[:] = [x for x in subdirs if x != "__pycache__"]
                      for fn in files:
                          # Keep source-update contents aligned with every file
                          # in the packages/data_dirs declared by the manifest.
                          target = os.path.join("src_out", os.path.relpath(root, "."))
                          os.makedirs(target, exist_ok=True)
                          shutil.copy(os.path.join(root, fn), target)
          sys.path.insert(0, ".")
          from version import __version__
          manifest = {"version": __version__, "released": datetime.date.today().isoformat(), "files": {}}
          for root, subdirs, files in os.walk("src_out"):
              subdirs[:] = [x for x in subdirs if x != "__pycache__"]
              for fn in files:
                  path = os.path.join(root, fn)
                  rel = os.path.relpath(path, "src_out")
                  data = open(path, "rb").read()
                  manifest["files"][rel] = {"sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          with open("src_out/manifest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          os.system("cd src_out && zip -qr ../src_manifest.zip .")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            laintas-cli_source.zip
            src_manifest.zip

  windows-payload:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: artifacts/linux-amd64

      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64

      - name: Extract Linux runtime for the private WSL distribution
        run: |
          mkdir -p artifacts/linux-runtime
          tar -xzf artifacts/linux-amd64/laintas-cli_linux_amd64.tar.gz \
            -C artifacts/linux-runtime
          test -x artifacts/linux-runtime/laintas-cli

      - name: Build Windows launcher and private WSL payload
        run: |
          bash build/windows/build_windows_package.sh amd64 \
            "$PWD/artifacts/linux-runtime/laintas-cli"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-payload
          path: build/windows/payload/
          retention-days: 1

  windows:
    needs: windows-payload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer-payload
          path: build/windows/payload

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build the single-file Windows installer
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0,'.'); from version import __version__; print(__version__)"
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis.exe" }
          $log = & $makensis "/DAPP_VERSION=$version" build/windows/installer.nsi 2>&1
          if ($LASTEXITCODE -ne 0) {
            $log | Select-Object -Last 80 | ForEach-Object { Write-Host $_ }
            throw "NSIS installer build failed (exit $LASTEXITCODE)"
          }
          if (-not (Test-Path laintas-cli_windows_amd64_setup.exe)) {
            throw "NSIS reported success but produced no installer"
          }
          $header = [IO.File]::ReadAllBytes("laintas-cli_windows_amd64_setup.exe")[0..1]
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw "Windows installer does not have a PE executable header"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: laintas-cli_windows_amd64_setup.exe

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev
          sudo gem install fpm
      - name: Build amd64 Debian package
        run: bash build/linux/build_deb.sh
      - name: Stage Debian package
        run: cp "$(ls dist/laintas-cli_*_amd64.deb | head -1)" laintas-cli.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: laintas-cli.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, source, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Determine version
        id: ver
        run: |
          V=$(python3 -c "import sys; sys.path.insert(0,'.'); from version import __version__ as v; print(v)")
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG:-v$V}" >> "$GITHUB_OUTPUT"
      - name: Stage release files and checksums
        run: |
          mkdir -p release
          cp artifacts/linux-amd64/laintas-cli_linux_amd64.tar.gz release/
          cp artifacts/linux-arm64/laintas-cli_linux_arm64.tar.gz release/
          cp artifacts/windows-amd64/laintas-cli_windows_amd64_setup.exe release/
          cp artifacts/source/laintas-cli_source.zip release/
          cp artifacts/source/src_manifest.zip release/
          cp artifacts/deb/laintas-cli.deb "release/laintas-cli_${{ steps.ver.outputs.version }}_amd64.deb"
          cd release
          sha256sum laintas-cli_linux_amd64.tar.gz laintas-cli_linux_arm64.tar.gz \
            laintas-cli_windows_amd64_setup.exe \
            laintas-cli_source.zip "laintas-cli_${{ steps.ver.outputs.version }}_amd64.deb" > SHA256SUMS.txt
          unzip -o src_manifest.zip -d src/ >/dev/null
          cp src/manifest.json .
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Linux amd64/arm64, a single-file Windows amd64 installer with a private WSL runtime, Debian amd64, and source packages." \
            --generate-notes \
            release/laintas-cli_linux_amd64.tar.gz \
            release/laintas-cli_linux_arm64.tar.gz \
            release/laintas-cli_windows_amd64_setup.exe \
            release/laintas-cli_source.zip \
            "release/laintas-cli_${{ steps.ver.outputs.version }}_amd64.deb" \
            release/SHA256SUMS.txt release/manifest.json release/src_manifest.zip
