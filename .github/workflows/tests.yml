name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to the same ref makes the in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # tests/test_auto_pilot.py and tests/test_markdown_theme.py import
          # pytest, so it is a test dependency even though the suite also runs
          # under unittest.
          pip install pytest

      # Two tests fail on a clean checkout for reasons unrelated to any change
      # under review (see tests/KNOWN_FAILURES.md). They are deselected so this
      # job is GREEN on arrival — a gate that is red from day one gets ignored
      # within a week, and then it gates nothing. Everything else must pass.
      - name: Run test suite
        run: |
          python -m pytest tests/ -q \
            --deselect "tests/test_slash_commands.py::SlashRegistryTests::test_mode_study_switches_and_explains_itself" \
            --deselect "tests/test_slash_commands.py::SlashRegistryTests::test_usage_model_tier_mapping_and_rendering"

      # Informational only: tells us the day someone fixes them, so the
      # deselect list above can shrink. Never fails the build.
      - name: Known failures (informational)
        if: always()
        continue-on-error: true
        run: |
          python -m pytest tests/ -q \
            "tests/test_slash_commands.py::SlashRegistryTests::test_mode_study_switches_and_explains_itself" \
            "tests/test_slash_commands.py::SlashRegistryTests::test_usage_model_tier_mapping_and_rendering" \
            || echo "Still failing as expected — see tests/KNOWN_FAILURES.md"
