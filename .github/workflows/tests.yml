name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to the same ref makes the in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # tests/test_auto_pilot.py and tests/test_markdown_theme.py import
          # pytest, so it is a test dependency even though the suite also runs
          # under unittest. Pillow is a lazy optional import in vision.py but
          # a hard one in tests/test_vision.py — without it collection died
          # and this job ran no tests at all, which is how it stayed red while
          # reading like a normal failure.
          pip install pytest pillow

      # Undefined names only. Every one this found was a real bug that no
      # test caught, because each sat behind an `except` that turned the
      # NameError into a fallback: a parent() command run twice, file_push
      # failing on every call, /canvas unable to start Helpwo. Zero false
      # positives across the tree, so it can gate.
      - name: Undefined names (ruff F821)
        run: |
          pip install ruff
          ruff check --select F821 --exclude venv,build .

      # No deselect list: the two tests that used to need one now pass, which
      # the informational step that watched for exactly that reported the
      # first time this job got far enough to run anything.
      - name: Run test suite
        run: python -m pytest tests/ -q
